{{define "content"}}
<section class="item item-image">
  <figure class="image">
    {{if .Burned}}<img src="{{.EmbedURL}}" alt="{{.Title}}"{{with .Item.Width}} width="{{.}}"{{end}}{{with .Item.Height}} height="{{.}}"{{end}}>{{else}}<a href="{{.EmbedURL}}"><img src="{{.EmbedURL}}" alt="{{.Title}}"{{with .Item.Width}} width="{{.}}"{{end}}{{with .Item.Height}} height="{{.}}"{{end}}></a>{{end}}
  </figure>
  <h1>{{.Title}}</h1>
  <dl class="meta">
    {{if .Item.Width}}<dt>Size</dt><dd>{{.Item.Width}} × {{.Item.Height}} · {{.Size}}</dd>{{else}}<dt>Size</dt><dd>{{.Size}}</dd>{{end}}
    <dt>Type</dt><dd>{{.Item.Mime}}{{with .Item.OrigMime}} (converted from {{.}}){{end}}</dd>
  </dl>
  {{template "notices" .}}
  {{if not .Burned}}
  <div class="copy-rows">
    <label>Link<input readonly value="{{.URL}}"></label><button type="button" class="button secondary" data-copy="{{.URL}}">Copy</button>
    <label>Direct<input readonly value="{{.EmbedURL}}"></label><button type="button" class="button secondary" data-copy="{{.EmbedURL}}">Copy</button>
    <label>Markdown<input readonly value="{{.Markdown}}"></label><button type="button" class="button secondary" data-copy="{{.Markdown}}">Copy</button>
  </div>
  <p class="actions">
    <a class="button" href="{{.DownloadURL}}">Download</a>
  </p>
  {{end}}
</section>
<script src="/static/copy.js" defer></script>
{{end}}
