{{define "content"}}
<section class="item item-burn">
  <h1>{{.Title}}</h1>
  <p>{{if eq .Kind "image"}}{{t "burn.notice_image"}}{{else if eq .Kind "text"}}{{t "burn.notice_text"}}{{else}}{{t "burn.notice_file"}}{{end}}</p>
  <form method="post" action="{{.Action}}">
    <button type="submit" class="button">{{if or (eq .Kind "image") (eq .Kind "text")}}{{t "action.reveal"}}{{else}}{{t "action.download"}}{{end}}</button>
  </form>
</section>
{{end}}
