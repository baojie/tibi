<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tibi</title>
<link rel="stylesheet" href="ui.css">
<style>main { max-width: 560px; margin: 32px auto; padding: 0 16px; }</style>
</head>
<body>
<main>
  <h1 data-i18n="optionsTitle"></h1>
  <form id="f">
    <label for="server" data-i18n="serverLabel"></label>
    <input id="server" type="url" placeholder="https://tibi.example.com" required>
    <label for="token" data-i18n="tokenLabel"></label>
    <input id="token" type="password" placeholder="tibi_…" autocomplete="off" required>
    <p class="muted"><small data-i18n="tokenHelp"></small></p>
    <button type="submit" data-i18n="save"></button>
  </form>
  <p id="status" class="status" hidden></p>
  <p id="cors" class="muted" hidden><span data-i18n="corsHelp"></span><br><code id="origin"></code></p>
  <label style="font-weight:normal"><input id="allsites" type="checkbox"> <span data-i18n="allSitesLabel"></span></label>
</main>
<script src="options.js" type="module"></script>
</body>
</html>
