{{define "content"}}
<section class="item owner-page" id="upload-page">
  <h1>{{t "upload.title"}}</h1>
  <form id="token-setup" class="panel" hidden>
    <h2>{{t "token.title"}}</h2>
    <p class="muted">{{t "token.help"}}</p>
    <p class="row"><input name="token" type="password" autocomplete="off" placeholder="{{t "token.placeholder"}}" required><button type="submit" class="button">{{t "token.save"}}</button></p>
    <p class="error" id="token-error" hidden>{{t "token.invalid"}}</p>
  </form>
  <div id="uploader" hidden>
    <p class="muted row"><span id="token-status"></span> <button type="button" class="link-button" id="token-forget">{{t "token.forget"}}</button></p>
    <label class="dropzone" id="dropzone">
      <input type="file" id="file-input" multiple hidden>
      <span>{{t "upload.drop"}} <u>{{t "upload.choose"}}</u></span>
    </label>
    <div class="options row">
      <label>{{t "upload.expires"}}
        <select id="opt-expires">
          <option value="never">{{t "upload.never"}}</option>
          <option value="10m">10m</option><option value="1h">1h</option><option value="1d">1d</option>
          <option value="7d">7d</option><option value="30d">30d</option>
        </select>
      </label>
      <label><input type="checkbox" id="opt-private"> {{t "upload.private"}}</label>
      <label><input type="checkbox" id="opt-burn"> {{t "upload.burn"}}</label>
      <label><input type="checkbox" id="opt-album"> {{t "upload.album"}}</label>
    </div>
    <form id="text-form" class="panel">
      <textarea name="text" spellcheck="false" placeholder="{{t "upload.text_placeholder"}}"></textarea>
      <p class="row"><label>{{t "upload.lang"}} <input name="lang" placeholder="{{t "upload.lang_auto"}}" size="12"></label><button type="submit" class="button">{{t "upload.text_button"}}</button></p>
    </form>
    <p id="upload-status" class="muted" aria-live="polite"></p>
    <h2 id="results-title" hidden>{{t "upload.results"}}</h2>
    <ul id="results" class="results"></ul>
  </div>
</section>
<script src="/static/i18n.js" defer></script>
<script src="/static/upload.js" defer></script>
{{end}}
