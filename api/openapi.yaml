openapi: 3.1.0
info:
  title: tibi API
  version: 0.0.1
  description: |
    Self-hosted image host + pastebin. Upload anything, get back a URL.
    This file is the source of truth for /api/v1.
servers:
  - url: /
security:
  - bearer: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is up
          content:
            text/plain:
              schema: { type: string }
  /api/v1/openapi.yaml:
    get:
      summary: This contract
      security: []
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/whoami:
    get:
      summary: Describe the calling token
      responses:
        "200":
          description: Token info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/items:
    post:
      summary: Upload an item (raw body)
      description: |
        The request body is the content. Options are given as query
        parameters or as the equivalent `X-Tibi-*` headers
        (`X-Tibi-Filename`, `X-Tibi-Title`, `X-Tibi-Source`, `X-Tibi-Meta`).
        Requires scope `upload`.
      parameters:
        - { name: filename, in: query, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string }, description: "client tag, e.g. cli, chrome, adseen" }
        - { name: meta, in: query, schema: { type: string }, description: "JSON object of client metadata" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "API token, format `tibi_` + 32 base62 characters"
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or revoked token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Whoami:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [upload, read_private, delete, admin] } }
        quota_bytes: { type: [integer, "null"] }
    Item:
      type: object
      required: [id, kind, url, raw_url, download_url, mime, size, visibility, expires_at, created_at]
      properties:
        id: { type: string, pattern: "^[0-9A-Za-z]{8}$" }
        kind: { type: string, enum: [image, video, audio, text, file, encrypted] }
        url: { type: string, format: uri }
        raw_url: { type: string, format: uri }
        download_url: { type: string, format: uri }
        mime: { type: string }
        size: { type: integer }
        filename: { type: string }
        title: { type: string }
        visibility: { type: string, enum: [unlisted, private] }
        expires_at: { type: [integer, "null"] }
        created_at: { type: integer }
