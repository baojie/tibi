name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: HEIC tools (encoder for fixtures, converter under test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265 libheif-plugin-x265
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: browser end-to-end (paste an image into the upload page)
        run: scripts/e2e/run.sh
      - name: real HEIC conversion must run here, not skip
        run: |
          go test -count=1 -v -run TestHEICRealConverter ./internal/server/ | tee heic.log
          grep -q -- "--- PASS: TestHEICRealConverter" heic.log
  test-s3:
    # The whole suite again, with blobs in an S3-compatible store
    # (versitygw: an S3 gateway over a local directory).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test on S3
        run: scripts/test-s3.sh -race ./...
  package:
    # Keep the release pipeline working without publishing anything:
    # a GoReleaser snapshot (binaries, archives, .deb) and the Docker image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          HOMEBREW_TAP_TOKEN: unused
      - name: .deb contents
        run: dpkg -c dist/*_linux_amd64.deb | grep -E "usr/bin/tibi|tibi.service|etc/tibi/server.toml"
      - name: Docker image (HEIC converter present)
        run: |
          docker build -t tibi:ci .
          docker run --rm --entrypoint vips tibi:ci --version
