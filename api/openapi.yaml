openapi: 3.1.0
info:
  title: tibi API
  version: 0.0.10
  description: |
    tibi (题壁) is a self-hosted image host and pastebin: upload an image, a
    text or code snippet, or any file, and get back a URL to share.

    This document is the source of truth for `/api/v1`. It is served at
    `/api/v1/openapi.yaml`, and the test suite checks every API response
    against it.

    **Authentication.** Send `Authorization: Bearer tibi_…`. Tokens carry
    scopes: `upload` (upload, list, search, view metadata, change metadata),
    `delete`, `read_private` (see private items on public URLs) and `admin`
    (all of them).

    **Errors** use one envelope: `{"error": {"code": "…", "message": "…"}}`.

    **Web pages.** `/upload` and `/recent` are the owner's pages; they keep
    an API token in the browser's local storage and call this API.

    **Limits.** Raw content answers `429` (with `Retry-After`) once an item
    or the whole instance used up its daily bandwidth allowance; view pages
    stay available and explain. With `allowed_referers` set, images, video
    and audio embedded by other sites answer `403`. Uploads beyond a
    token's quota answer `413`.

    **Public URLs** (not part of this API) are fixed forever:
    `/{id}` view page, `/{id}.{ext}` raw bytes for embedding, `/{id}/raw`,
    `/{id}/dl` download, `/{id}/thumb` image thumbnail, `/s/{slug}` short
    link, `/c/{id}` collection. Raw routes support `Range`.

    **Collections** group items in order: an album (all images: shown as a
    thumbnail grid) or a multi-file paste (shown stacked). Item and
    collection IDs share one namespace.

    **Content is immutable.** To "edit" an item, fork it: the new item has
    `forked_from` set and the original stays as it was.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: items
    description: Upload, list, inspect, change and delete items.
  - name: collections
    description: Albums and multi-file pastes.
  - name: search
  - name: meta
    description: Server and token information.
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        "200":
          description: The server and its database are up.
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: The database is unavailable.
          content:
            text/plain:
              schema: { type: string }
  /metrics:
    get:
      tags: [meta]
      summary: Prometheus metrics
      operationId: metrics
      description: |
        Prometheus text format: requests, upload and served bytes, GC
        activity, items by kind, storage used, today's traffic. Allowed with
        an `admin` token, or from the same machine on a direct connection
        (requests forwarded by a reverse proxy never count as local).
      security: [{}, { bearer: [] }]
      responses:
        "200":
          description: Metrics.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/stats:
    get:
      tags: [meta]
      summary: Instance statistics
      operationId: stats
      description: Storage, item counts, traffic and the most-served items. Requires scope `admin`.
      responses:
        "200":
          description: Statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      summary: This document
      operationId: openapi
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/whoami:
    get:
      tags: [meta]
      summary: Describe the calling token
      description: Any valid token may call this; clients use it to verify a login.
      operationId: whoami
      responses:
        "200":
          description: The token's name, scopes and quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/items:
    post:
      tags: [items]
      summary: Upload one or more items
      operationId: upload
      description: |
        Requires scope `upload`. Two request forms:

        - **multipart/form-data** — one or more `file` parts, plus optional
          form fields with the same names as the query parameters below.
          Fields may come before or after the files. Each part's filename is
          used. One file returns an Item; several return an array, in order.
        - **raw body** — the body is the content. Options are query
          parameters, or headers named `X-Tibi-` plus the parameter name in
          title case with dashes (`X-Tibi-Filename`, `X-Tibi-Keep-Meta`,
          `X-Tibi-Burn-After-Read`, …).

        The kind is detected from the content:

        | kind | formats |
        |---|---|
        | `image` | PNG, JPEG, GIF, WebP, AVIF; HEIC/HEIF converted to JPEG when the server has a converter (`orig_mime` keeps the original type) |
        | `video` | MP4, WebM, MOV |
        | `audio` | MP3, Ogg, Opus, M4A, WAV, FLAC |
        | `text` | valid UTF-8 text; GBK/GB18030, Big5, Shift_JIS, EUC-JP, EUC-KR, Latin-1 and UTF-16 (with BOM) are converted to UTF-8 and `charset` records the original |
        | `file` | everything else, and always SVG, HTML, XHTML and JavaScript (never rendered) |

        EXIF (including GPS), XMP and text metadata are removed losslessly
        from JPEG, PNG and WebP unless `keep_meta=1`; JPEG orientation is
        kept. Identical content is stored once.
      parameters:
        - { name: filename, in: query, schema: { type: string }, description: "Original file name (multipart parts carry their own)." }
        - { name: title, in: query, schema: { type: string } }
        - name: kind
          in: query
          description: Force `text` or `file`; media kinds cannot be forced.
          schema: { type: string, enum: [text, file] }
        - name: lang
          in: query
          description: Highlighting language (name, alias or extension, e.g. `python`, `py`); inferred when omitted; unknown names are rejected.
          schema: { type: string }
        - name: keep_meta
          in: query
          description: Keep image metadata (EXIF, GPS, XMP).
          schema: { type: string, enum: ["0", "1", "true", "false"] }
        - name: expires
          in: query
          description: Lifetime, e.g. `10m`, `1h`, `7d`, `30d`, or `never`. Default is the server's `default_expires`.
          schema: { type: string }
        - name: visibility
          in: query
          description: "`private` items are served only to tokens with `read_private`."
          schema: { type: string, enum: [unlisted, private], default: unlisted }
        - name: slug
          in: query
          description: "Short link `/s/{slug}`: 3–64 characters of `a-z`, `0-9` and `-`, not a reserved word. Moves from any item that had it. Single-file uploads only."
          schema: { type: string }
        - name: burn_after_read
          in: query
          description: Delete the item when it is first revealed by a visitor without a `read_private` token.
          schema: { type: string, enum: ["0", "1", "true", "false"] }
        - { name: source, in: query, schema: { type: string }, description: "Client tag, e.g. `cli`, `chrome`, `adseen`." }
        - { name: meta, in: query, schema: { type: string }, description: "Client metadata (a JSON object as text)." }
        - name: collection
          in: query
          description: "`new` puts all uploaded files into a new collection, in order; a collection ID appends them to it. The response is then a CollectionUpload. Not allowed with `burn_after_read`."
          schema: { type: string }
        - { name: collection_title, in: query, schema: { type: string }, description: "Title of the new collection (with `collection=new`)." }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: array, items: { type: string, format: binary } }
                title: { type: string }
                kind: { type: string, enum: [text, file] }
                lang: { type: string }
                keep_meta: { type: string }
                expires: { type: string }
                visibility: { type: string, enum: [unlisted, private] }
                slug: { type: string }
                burn_after_read: { type: string }
                source: { type: string }
                meta: { type: string }
                collection: { type: string }
                collection_title: { type: string }
      responses:
        "201":
          description: Created. An Item for one file, an array of Items for several, or a CollectionUpload when `collection` is set.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Item" }
                  - { type: array, minItems: 2, items: { $ref: "#/components/schemas/Item" } }
                  - { $ref: "#/components/schemas/CollectionUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
    get:
      tags: [items]
      summary: List items, newest first
      operationId: listItems
      description: Live items (not deleted or expired), including private ones. Requires scope `upload`.
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/kind" }
        - { name: source, in: query, schema: { type: string }, description: Only items uploaded with this `source` tag. }
        - { name: collection, in: query, schema: { type: string }, description: Only items of this collection. }
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9A-Za-z]{8}$" } }
    get:
      tags: [items]
      summary: Item metadata
      operationId: getItem
      description: Any visibility. Requires scope `upload`.
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [items]
      summary: Change metadata
      operationId: patchItem
      description: |
        Content is immutable. Only these fields can be set: `title`, `lang`
        (text items), `visibility`, `expires` (relative to now, or `never`)
        and `slug` (an empty string removes it). Any other field is
        rejected. Requires scope `upload`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                lang: { type: string }
                visibility: { type: string, enum: [unlisted, private] }
                expires: { type: string }
                slug: { type: string }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [items]
      summary: Delete an item
      operationId: deleteItem
      description: The item returns 404 at once and is purged after a day. Requires scope `delete`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/items/{id}/share-link:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [items]
      summary: Signed, time-limited link
      operationId: shareLink
      description: |
        Returns a view-page URL carrying `exp` and `sig` parameters (an
        HMAC-SHA256 over the item ID and expiry, with a server secret).
        Anyone with the link can view the item — typically a private one —
        and its raw, download and thumbnail URLs until the link expires; it
        never outlives the item. Requires scope `upload`.
      parameters:
        - name: ttl
          in: query
          description: Lifetime, e.g. `10m`, `1h`, `7d`; at most `365d`. Default `1h`.
          schema: { type: string }
      responses:
        "200":
          description: The signed URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/items/{id}/fork:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [items]
      summary: Fork an item (new version)
      operationId: forkItem
      description: |
        The request body is the new content, as in a raw-body upload. The
        new item gets `forked_from` = the original's ID; the original is
        unchanged. `title`, `filename`, `lang` and `visibility` default to
        the original's; forks of text stay text. Requires scope `upload`.
      parameters:
        - { name: title, in: query, schema: { type: string } }
        - { name: filename, in: query, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [text, file] } }
        - { name: visibility, in: query, schema: { type: string, enum: [unlisted, private] } }
        - { name: expires, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The new item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /api/v1/collections:
    post:
      tags: [collections]
      summary: Create a collection
      operationId: createCollection
      description: Optionally gathers existing items, in the given order (items already in another collection are rejected). Requires scope `upload`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                visibility: { type: string, enum: [unlisted, private] }
                expires: { type: string }
                items: { type: array, items: { type: string } }
      responses:
        "201":
          description: The collection, with its items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [collections]
      summary: List collections, newest first
      operationId: listCollections
      description: Requires scope `upload`.
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: A page of collections (without their items).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/collections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [collections]
      summary: A collection and its items
      operationId: getCollection
      description: Requires scope `upload`.
      responses:
        "200":
          description: The collection, with its live items in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [collections]
      summary: Change a collection or reorder its items
      operationId: patchCollection
      description: "`items` must list every item of the collection exactly once, in the new order. Requires scope `upload`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                visibility: { type: string, enum: [unlisted, private] }
                expires: { type: string }
                items: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated collection, with its items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [collections]
      summary: Delete a collection and its items
      operationId: deleteCollection
      description: The collection and every item in it are deleted (purged after a day). Requires scope `delete`.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/search:
    get:
      tags: [search]
      summary: Full-text search
      operationId: search
      description: |
        Finds live items whose title, filename or text contain **every**
        word of `q`, newest first. Words of three or more characters match
        anywhere, including inside identifiers (`Upload` finds
        `handleUpload`); shorter words match word starts. Chinese, Japanese
        and Korean match any substring, including one or two characters.
        Matching ignores case. Encrypted items are never indexed. Requires
        scope `upload`.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 500 } }
        - { $ref: "#/components/parameters/kind" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: A page of matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "API token: `tibi_` followed by 32 letters and digits."
  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: { type: string }
    kind:
      name: kind
      in: query
      schema: { $ref: "#/components/schemas/Kind" }
  responses:
    BadRequest:
      description: The request is invalid; `message` says why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: The token is missing, invalid or revoked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The token lacks the required scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such item (or it was deleted or has expired).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The upload exceeds `max_upload_bytes`, or the token's upload quota (`message` gives the numbers).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Kind:
      type: string
      enum: [image, video, audio, text, file, encrypted]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, empty, unauthorized, forbidden, not_found, too_large, internal]
            message: { type: string }
    Whoami:
      type: object
      additionalProperties: false
      required: [name, scopes, quota_bytes, used_bytes]
      properties:
        name: { type: string }
        used_bytes: { type: integer, description: Total size of the live items this token uploaded (what the quota counts). }
        scopes:
          type: array
          items: { type: string, enum: [upload, read_private, delete, admin] }
        quota_bytes: { type: [integer, "null"], description: Upload quota in bytes; null for unlimited. }
    Item:
      type: object
      additionalProperties: false
      required: [id, kind, url, raw_url, download_url, markdown, mime, size, visibility, burn_after_read, view_count, expires_at, created_at]
      properties:
        id: { type: string, pattern: "^[0-9A-Za-z]{8}$" }
        kind: { $ref: "#/components/schemas/Kind" }
        url: { type: string, format: uri, description: View page. }
        raw_url: { type: string, format: uri, description: "Raw bytes, `/{id}.{ext}`: the URL to embed." }
        download_url: { type: string, format: uri }
        markdown: { type: string, description: "`![](raw_url)` for images, `[name](url)` otherwise." }
        mime: { type: string, description: Type of the stored bytes. }
        orig_mime: { type: string, description: "Original type when the upload was converted (e.g. `image/heic`)." }
        size: { type: integer, description: Stored bytes (after metadata removal or conversion). }
        width: { type: integer, description: "Images: display width (EXIF rotation applied)." }
        height: { type: integer, description: "Images: display height." }
        duration_ms: { type: integer, description: Video and audio length, when the container header has it. }
        thumbnail_url: { type: string, format: uri, description: "Images: 400px-wide WebP thumbnail." }
        filename: { type: string }
        title: { type: string }
        lang: { type: string, description: "Text: language, e.g. `go`, `python`, `markdown`, `text`." }
        charset: { type: string, description: "Text: original charset when converted to UTF-8, e.g. `GBK`." }
        visibility: { type: string, enum: [unlisted, private] }
        slug: { type: string }
        slug_url: { type: string, format: uri }
        collection_id: { type: string }
        collection_url: { type: string, format: uri }
        position: { type: integer, description: Order within the collection. }
        forked_from: { type: string, description: ID of the item this one is a new version of. }
        burn_after_read: { type: boolean }
        source: { type: string }
        view_count: { type: integer }
        expires_at: { type: [integer, "null"], description: Unix seconds; null for never. }
        created_at: { type: integer, description: Unix seconds. }
    ItemPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        next_cursor: { type: [string, "null"], description: Pass as `cursor` for the next page; null on the last page. }
    Stats:
      type: object
      additionalProperties: false
      required: [items, items_by_kind, logical_bytes, storage_bytes, bytes_served_total, bytes_served_today, collections, tokens, top_items]
      properties:
        items: { type: integer, description: Live items. }
        items_by_kind: { type: object, description: "Live items per kind, e.g. `{\"image\": 12}`." }
        logical_bytes: { type: integer, description: Total size of live items. }
        storage_bytes: { type: integer, description: Bytes of distinct stored blobs (identical content is stored once). }
        bytes_served_total: { type: integer }
        bytes_served_today: { type: integer, description: Since midnight UTC; what daily caps count. }
        collections: { type: integer }
        tokens: { type: integer, description: Active (not revoked) tokens. }
        top_items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, url, kind, name, view_count, bytes_served]
            properties:
              id: { type: string }
              url: { type: string, format: uri }
              kind: { $ref: "#/components/schemas/Kind" }
              name: { type: string }
              view_count: { type: integer }
              bytes_served: { type: integer }
    ShareLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: integer, description: Unix seconds. }
    Collection:
      type: object
      additionalProperties: false
      required: [id, url, visibility, item_count, expires_at, created_at]
      properties:
        id: { type: string, pattern: "^[0-9A-Za-z]{8}$" }
        url: { type: string, format: uri, description: "The collection page, `/c/{id}`." }
        title: { type: string }
        visibility: { type: string, enum: [unlisted, private] }
        item_count: { type: integer }
        expires_at: { type: [integer, "null"] }
        created_at: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/Item" }, description: Present when a single collection is returned. }
    CollectionPage:
      type: object
      additionalProperties: false
      required: [collections, next_cursor]
      properties:
        collections: { type: array, items: { $ref: "#/components/schemas/Collection" } }
        next_cursor: { type: [string, "null"] }
    CollectionUpload:
      type: object
      additionalProperties: false
      required: [collection, items]
      properties:
        collection: { $ref: "#/components/schemas/Collection" }
        items: { type: array, items: { $ref: "#/components/schemas/Item" }, description: The items just uploaded. }
    SearchHit:
      description: An Item plus `snippet`, the line of text containing the first query word.
      allOf:
        - { $ref: "#/components/schemas/Item" }
      properties:
        snippet: { type: string }
      unevaluatedProperties: false
    SearchPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        next_cursor: { type: [string, "null"] }
